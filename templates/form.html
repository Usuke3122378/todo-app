{% extends "base.html" %}
{% block body %}
  <h2>{{ "やることを登録" if is_new else "やることを編集" }}</h2>
  {% if message %}<p class="msg">{{ message }}</p>{% endif %}

  <form method="post" action="{{ url_for('new') if is_new else '' }}">
    <label>タイトル</label>
    <input name="title" required value="{{ todo.title if todo else '' }}">

    <label>内容</label>
    <textarea name="content">{{ todo.content if todo else '' }}</textarea>

    <label>期日</label>
    <input type="date" name="due_date" required value="{{ todo.due_date if todo else '' }}">

    <label>重要度</label>
    {% set pri = todo.priority if todo and todo.priority else "中" %}
    <select name="priority">
      {% for p in ["高", "中", "低"] %}
        <option value="{{ p }}" {{ "selected" if p == pri }}>{{ p }}</option>
      {% endfor %}
    </select>

    <p>
      <button class="btn" type="submit">保存する</button>
      <a class="btn sub" href="{{ url_for('index') }}">戻る</a>
    </p>
  </form>
{% endblock %}

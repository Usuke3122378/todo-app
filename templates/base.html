<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todoリスト</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #222; }
    h1 a { color: inherit; text-decoration: none; }
    .btn { display: inline-block; padding: 8px 16px; background: #2f6fde; color: #fff; border: none; border-radius: 6px; text-decoration: none; font-size: 15px; cursor: pointer; }
    .btn.sub { background: #888; }
    .card { background: #fff; border-radius: 8px; padding: 12px 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card h2 { margin: 0 0 4px; font-size: 18px; }
    .due { color: #c0392b; font-size: 14px; }
    .content { white-space: pre-wrap; margin: 8px 0; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    .btn.small { padding: 4px 10px; font-size: 13px; margin-right: 8px; }
    .sort { margin: 16px 0 4px; font-size: 14px; }
    .sort a { margin-right: 8px; padding: 4px 10px; border-radius: 12px; background: #e3e6eb; color: #333; text-decoration: none; }
    .sort a.on { background: #2f6fde; color: #fff; }
    .pri { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; vertical-align: middle; }
    .pri-高 { background: #e74c3c; } .pri-中 { background: #f39c12; } .pri-低 { background: #7f8c8d; }
    .card.done { opacity: .5; } .card.done h2 { text-decoration: line-through; }
    form.quick { display: flex; gap: 8px; margin-bottom: 8px; }
    form.quick button { white-space: nowrap; }
    .msg { background: #eaf2ff; border-left: 4px solid #2f6fde; padding: 8px 12px; }
    form.inline { display: inline; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    textarea { height: 120px; }
  </style>
</head>
<body>
  <h1><a href="{{ url_for('index') }}">📝 Todoリスト</a></h1>
  {% block body %}{% endblock %}
</body>
</html>
